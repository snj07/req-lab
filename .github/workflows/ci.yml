name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-jvm-and-desktop:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core + integration + desktop UI tests
        run: |
          ./gradlew \
            :core-network:allTests \
            :core-storage:allTests \
            :qa-tests:jvmTest \
            :ui-desktop:desktopTest

  verify-shared-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile all modules
        run: ./gradlew build -x test
