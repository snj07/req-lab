name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ubuntu:
    name: Build & Shared Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run shared/core checks
        run: ./gradlew :core-model:allTests :core-network:allTests :core-storage:allTests :core-scripting:allTests :feature-requests:allTests :ui-shared:allTests --no-daemon

  test-macos:
    name: Desktop & Integration Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run integration and desktop tests
        run: ./gradlew :qa-tests:jvmTest :ui-desktop:desktopTest --no-daemon

  package-desktop:
    name: Package Desktop (${{ matrix.os }})
    needs: [build-ubuntu, test-macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package for current OS (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./gradlew :ui-desktop:packageDistributionForCurrentOS --no-daemon

      - name: Package for current OS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :ui-desktop:packageDistributionForCurrentOS --no-daemon

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ runner.os }}
          path: |
            ui-desktop/build/compose/binaries/**
            ui-desktop/build/compose/jars/**
